name: Ritmo Ã¢â‚¬Â¢ build Windows (sem publicaÃƒÂ§ÃƒÂ£o)
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'VersÃƒÂ£o de prÃƒÂ©via; build nunca publica'
        type: string
        default: v0.1.0-preview.1
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build sem instalar, suÃƒÂ­te e inventÃƒÂ¡rio
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || 'v0.1.0-preview.1' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RITMO_BUILD_ROOT = Join-Path $env:RUNNER_TEMP 'ritmo-build'
          & ./scripts/build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build falhou' }
          $stages = @(Get-ChildItem $env:RITMO_BUILD_ROOT -Directory -Filter 'RitmoStage-*')
          if ($stages.Count -ne 1) { throw 'Pacote ambÃƒÂ­guo' }
          & ./.buildvenv/Scripts/python.exe -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'SuÃƒÂ­te falhou' }
          & ./.buildvenv/Scripts/python.exe scripts/release_bundle.py pack --package (Join-Path $stages[0].FullName 'Ritmo') --out dist-release --version $env:VERSION --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --analysis-toc (Join-Path $env:RITMO_BUILD_ROOT 'RitmoBuild/Ritmo/Analysis-00.toc')
          if ($LASTEXITCODE -ne 0) { throw 'InventÃƒÂ¡rio falhou' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ritmo-distribuicao
          path: dist-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  clean-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ritmo-distribuicao
          path: release-assets
      - name: Extrair ZIP em runner novo e testar runtime empacotado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements-qa.txt psutil==7.1.3
          if ($LASTEXITCODE -ne 0) { throw 'QA dependencies failed' }
          python scripts/release_bundle.py verify --out release-assets --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'ZIP invÃƒÂ¡lido' }
          $facts = Get-Content release-assets/build-info.json -Raw | ConvertFrom-Json
          $clean = Join-Path $env:RUNNER_TEMP 'ritmo-extracted'
          Expand-Archive -LiteralPath (Join-Path release-assets $facts.archive) -DestinationPath $clean
          $exe = Join-Path $clean 'Ritmo/Ritmo.exe'
          python scripts/smoke_windows.py $exe (Join-Path $env:RUNNER_TEMP 'ritmo-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Smoke falhou' }
          python scripts/qa_packaged_windows.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'QA essencial falhou' }
          python scripts/qa_boolean_packaged.py $exe (Join-Path $env:RUNNER_TEMP 'boolean-qa')
          if ($LASTEXITCODE -ne 0) { throw 'QA booleano falhou' }
          New-Item -ItemType Directory qa-evidence | Out-Null
          @{
            source_commit=$facts.source_commit; archive_sha256=$facts.archive_sha256
            build_run_id=$facts.build_run_id; clean_windows=$true; result='passed'
            license_review='required'; vulnerability_review='required'; reviewed_by=''
            runner='windows-2025'; checks=@('smoke', 'packaged-windows', 'boolean-packaged')
          } | ConvertTo-Json | Set-Content -Encoding utf8 qa-evidence/clean-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ritmo-clean-windows-qa
          path: qa-evidence/*
          if-no-files-found: error
          retention-days: 14
